services:
  mcp-openalex:
    build:
      context: ./openalex
      dockerfile: Dockerfile
    container_name: mcp-openalex
    environment:
      OPENALEX_API_KEY: ${OPENALEX_API_KEY}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8011"
      MCP_TRANSPORT: http
      MCP_STATELESS: ${MCP_STATELESS:-false}
    ports:
      - "8011:8011"
    restart: unless-stopped

  mcp-sudoc-sru:
    build:
      context: ./sudoc-sru
      dockerfile: Dockerfile
    container_name: mcp-sudoc-sru
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8012"
      MCP_TRANSPORT: http
      MCP_STATELESS: ${MCP_STATELESS:-false}
    ports:
      - "8012:8012"
    restart: unless-stopped
    
  mcp-primo:
    build:
      context: ./primo
      dockerfile: Dockerfile
    container_name: mcp-primo
    environment:
      PRIMO_API_KEY: ${PRIMO_API_KEY}
      PRIMO_REGION: ${PRIMO_REGION:-na}
      PRIMO_VID: ${PRIMO_VID}
      PRIMO_TAB: ${PRIMO_TAB}
      PRIMO_SCOPE: ${PRIMO_SCOPE}
      PRIMO_INST: ${PRIMO_INST:-}
      PRIMO_LANG: ${PRIMO_LANG:-en}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8013"
      MCP_TRANSPORT: http
      MCP_STATELESS: ${MCP_STATELESS:-false}
    ports:
      - "8013:8013"
    restart: unless-stopped

  mcp-idref-resolver-api:
    build:
      context: ./idref-resolver-api
      dockerfile: Dockerfile
    container_name: mcp-idref-resolver-api
    environment:
      IDREF_API_URL: ${IDREF_API_URL:-http://localhost:8000}
      IDREF_API_KEY: ${IDREF_API_KEY}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8015"
      MCP_TRANSPORT: http
      MCP_STATELESS: ${MCP_STATELESS:-false}
    ports:
      - "8015:8015"
    restart: unless-stopped

  mcp-recherche-data-gouv:
    build:
      context: ./recherche-data-gouv
      dockerfile: Dockerfile
    container_name: mcp-recherche-data-gouv
    environment:
      RECHERCHE_DATA_GOUV_API_URL: ${RECHERCHE_DATA_GOUV_API_URL:-https://entrepot.recherche.data.gouv.fr/api}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8014"
      MCP_TRANSPORT: http
      MCP_STATELESS: ${MCP_STATELESS:-false}
    ports:
      - "8014:8014"
    restart: unless-stopped
